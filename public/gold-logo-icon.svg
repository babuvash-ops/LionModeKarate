<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="400" height="400" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D77F" />
      <stop offset="30%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA820A" />
      <stop offset="100%" stop-color="#FFB800" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#D4AF37" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Flame Crest Outline -->
  <path
    d="M 100 185
       C 80 162, 52 138, 44 112
       C 38 92, 34 82, 28 72
       C 24 65, 26 56, 34 54
       C 40 52, 44 58, 44 64
       C 43 52, 46 38, 54 26
       C 58 20, 64 22, 65 29
       C 66 36, 62 44, 60 50
       C 68 34, 78 18, 92 6
       C 96 2, 102 2, 105 7
       C 108 12, 108 24, 106 36
       C 114 26, 122 24, 128 28
       C 134 32, 132 40, 130 48
       C 138 46, 148 54, 150 62
       C 152 70, 144 76, 138 78
       C 146 90, 148 102, 144 118
       C 138 140, 120 164, 100 185 Z"
    stroke="url(#goldGrad)"
    stroke-width="4.5"
    stroke-linejoin="round"
    stroke-linecap="round"
    fill="none"
    filter="url(#goldGlow)"
  />

  <!-- Lion Head Core -->
  <!-- Main Face Silhouette with Eye and Nose Cutouts -->
  <g fill="url(#goldGrad)" filter="url(#goldGlow)">
    <path
      fill-rule="evenodd"
      d="M 100 78
         C 90 73, 80 66, 75 72
         C 70 78, 71 88, 68 96
         C 65 104, 64 112, 70 120
         C 75 127, 84 133, 93 131
         C 97 130, 99 126, 100 123
         C 101 126, 103 130, 107 131
         C 116 133, 125 127, 130 120
         C 136 112, 135 104, 132 96
         C 129 88, 130 78, 125 72
         C 120 66, 110 73, 100 78 Z

         /* Left Eye Cutout */
         M 78 92
         C 82 89, 87 90, 91 95
         C 88 97, 83 97, 78 92 Z

         /* Right Eye Cutout */
         M 122 92
         C 118 89, 113 90, 109 95
         C 112 97, 117 97, 122 92 Z

         /* Nose Cutout */
         M 94 109
         L 106 109
         C 104 114, 102 118, 100 120
         C 98 118, 96 114, 94 109 Z
      "
    />

    <!-- Separated Chin Oval -->
    <ellipse cx="100" cy="143" rx="14" ry="8" />
  </g>
</svg>